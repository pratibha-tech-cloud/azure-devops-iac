name: updatedpipeline
trigger: 
- main
- feature/*
pool:  IacAgent2
stages:
  - stage: terraformIac
    jobs:
      - job: terraformjob
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'IacConnection2'
            backendAzureRmOverrideSubscriptionID: '73c9b1d1-79bb-4bf7-8b46-db211fe52d6f'
            backendAzureRmResourceGroupName: 'rg-paglabackend'
            backendAzureRmStorageAccountName: 'paglabackend2'
            backendAzureRmContainerName: 'newcontainer'
            backendAzureRmKey: 'keycontainer'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'IacConnection2'
            environmentAzureRmOverrideSubscriptionID: '73c9b1d1-79bb-4bf7-8b46-db211fe52d6f'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            environmentServiceNameAzureRM: 'IacConnection2'
            environmentAzureRmOverrideSubscriptionID: '73c9b1d1-79bb-4bf7-8b46-db211fe52d6f'
            environmentAzureRmUseIdTokenGeneration: true